name: Desktop build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Release and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate application and tag versions
        run: node scripts/check-release.mjs
      - name: Updater manifest self-test
        run: node scripts/build-updater-manifest.mjs --self-test
      - name: Updater config self-test
        run: node scripts/ensure-updater-config.mjs --self-test
      - name: Frontend regression tests
        run: node --experimental-strip-types --test "frontend/tests/*.test.mjs"
      - name: Audit JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm audit --audit-level=high
          npm --prefix frontend audit --audit-level=high

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm.cmd ci
          npm.cmd --prefix frontend ci

      - name: Ensure updater config matches signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/ensure-updater-config.mjs

      - name: Build icons
        run: npm.cmd run tauri icon frontend/public/favicon.svg

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm.cmd run tauri build -- --bundles nsis

      - name: Test native backend and persistence
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Colemak-DH-Tutor-Windows-x86_64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 14

  linux-arch:
    name: Linux Arch package
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Ensure updater config matches signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/ensure-updater-config.mjs

      - name: Build icons and Debian staging package
        run: |
          chmod +x packaging/arch/build-pkg.sh
          npm run tauri icon frontend/public/favicon.svg
          npm run tauri build -- --bundles deb

      - name: Build Arch package
        run: |
          deb_path=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          ./packaging/arch/build-pkg.sh "$deb_path"

      - name: Test native backend and persistence
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Colemak-DH-Tutor-Linux-x86_64
          path: dist/colemak-dh-tutor-*-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: macos-latest
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Ensure updater config matches signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/ensure-updater-config.mjs

      - name: Build icons and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm run tauri icon frontend/public/favicon.svg
          npm run tauri build -- --bundles app,dmg --target ${{ matrix.target }}

      - name: Test native backend and persistence
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Colemak-DH-Tutor-macOS-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-installer
      - linux-arch
      - macos-dmg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Download packaged applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          pattern: Colemak-DH-Tutor-*
          merge-multiple: true

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/build-updater-manifest.mjs \
            --dir release-artifacts \
            --repo "$GH_REPO" \
            --tag "$GITHUB_REF_NAME" \
            --out release-artifacts/latest.json

          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          (cd release-artifacts && find . -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS
          files+=(SHA256SUMS)

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ $(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) != true ]]; then
              echo "Refusing to overwrite an already published release. Use a new version tag." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --draft \
              --generate-notes \
              --title "Colemak-DH Tutor $GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
