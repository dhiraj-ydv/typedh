[package]
name = "typedh"
version = "0.1.2"
description = "TypeDH — Colemak-DH typing tutor"
authors = ["Exolithe Labs"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "typedh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
